databases:
  - name: revenueops-db
    plan: free
    region: oregon

services:
  - type: keyvalue
    name: revenueops-redis
    plan: free
    region: oregon
    ipAllowList: []

  - type: web
    name: revenueops-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerCommand: sh ./start.sh
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: revenueops-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: revenueops-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: revenueops-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: revenueops-worker
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=info --queues=celery
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: revenueops-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: revenueops-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: revenueops-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: LOG_LEVEL
        value: INFO
